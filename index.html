<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Formulario Digital Envíos · Tesorería IPUE</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eef2f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1424" media="(prefers-color-scheme: dark)">
<link rel="icon" href="logo-ipue.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<script>try { var t = localStorage.getItem('tes.tema'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { }</script>
<style>
/* Estilo EDEM · IPUE (edem-frontend/src/lib/theme): azul IPUE de #06224a a #4ea4ee, degradados a 120°,
   tarjetas blancas flotando sobre #eef2f9, botones y campos en píldora, saludo «Dios te bendiga» en dos pesos.
   Tipografía: Myriad Pro si está instalada; si no, Source Sans 3 (su hermana libre, también de Adobe).
   Métodos de pago (validados para daltonismo): cajero azul IPUE, TPV turquesa, Bizum oro. */
:root{color-scheme:light dark;
--bg:light-dark(#eef2f9,#0a1424);--card:light-dark(#ffffff,#0f1e32);--card2:light-dark(#f5f9fe,#122036);
--ink:light-dark(#0e1a2c,#e8eef7);--navy:light-dark(#06224a,#c2d8f4);--muted:light-dark(#5a6a85,#9aabc4);--subtle:light-dark(#8094b4,#6c7e98);
--line:light-dark(#e3eaf3,#1d2c46);--line2:light-dark(#d6e4f5,#243556);
--brand:light-dark(#0e57b5,#4ea4ee);--brand-ink:light-dark(#0a3a82,#7ab4e0);--sky:light-dark(#1f7ad6,#5fc8d4);--soft:light-dark(#e6f0fb,#172641);
--input:light-dark(#f5f9fe,#0e1a2c);--input-f:light-dark(#ffffff,#122036);--ph:light-dark(#a8b8cf,#5a6a85);
--ok:light-dark(#0b7f59,#2dd4a4);--ok-soft:light-dark(#e2f5ec,#0f2e27);--bad:light-dark(#c42f2f,#ef6b6b);--bad-soft:light-dark(#fdf0f0,#2c1523);
--warn:light-dark(#8a6400,#f0b955);--warn-soft:light-dark(#fff4d6,#33280c);--paper:light-dark(#fffefa,#122036);
--m-ef:light-dark(#0e57b5,#4ea4ee);--m-tpv:light-dark(#00a896,#00a888);--m-biz:light-dark(#eaa400,#d28e05);--bar:var(--m-ef);
--grad:linear-gradient(120deg,#2a8ae6 0%,#0a3a82 55%,#06224a 100%);
--grad-btn:linear-gradient(120deg,#4ea4ee 0%,#1f7ad6 42%,#0a3a82 100%);
--grad-brand:radial-gradient(ellipse 70% 55% at 22% 92%,rgba(95,200,212,.55) 0%,rgba(42,157,171,.18) 35%,transparent 65%),radial-gradient(ellipse 90% 80% at 50% 40%,#1865c5 0%,#0e57b5 35%,#0a3a82 70%,#06224a 100%);
--sh-sm:0 1px 2px light-dark(rgba(14,87,181,.06),rgba(0,0,0,.3));
--sh:0 1px 2px light-dark(rgba(14,87,181,.04),rgba(0,0,0,.25)),0 10px 28px -14px light-dark(rgba(14,87,181,.20),rgba(0,0,0,.6));
--sh-pop:0 12px 38px light-dark(rgba(6,34,74,.18),rgba(0,0,0,.55)),0 2px 10px light-dark(rgba(6,34,74,.10),rgba(0,0,0,.3));
--sh-btn:0 8px 18px -8px light-dark(rgba(14,87,181,.55),rgba(78,164,238,.45));
--r:20px;--ease:cubic-bezier(.22,1,.36,1);
--font:"Myriad Pro","Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font);overflow-x:clip;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;transition:background .22s var(--ease)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* ── Cabecera ── */
.top{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.marca{display:flex;align-items:center;gap:10px;flex:1}
.marca img{height:38px;width:auto;display:block;flex:none}
.marca .vr{width:1px;align-self:stretch;margin:2px 0;background:linear-gradient(transparent,#4ea4ee,transparent);flex:none}
.marca b{display:block;font-size:17px;line-height:1.05;color:var(--navy);font-weight:700;letter-spacing:-.01em}
.marca small{display:block;font-size:12.5px;line-height:1.25;color:var(--sky);font-style:italic;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uchip{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:4px 12px 4px 4px;background:var(--grad);color:#fff;box-shadow:0 2px 12px rgba(14,87,181,.25);transition:transform .12s,box-shadow .12s;flex:none;min-height:42px}
.uchip:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(14,87,181,.32)}
.uchip .av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.uchip .ut{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
.uchip .ut b{font-size:14px;font-weight:700}.uchip .ut small{font-size:11px;font-weight:300;opacity:.8}
.menu{position:fixed;width:min(290px,calc(100vw - 32px));background:var(--card);border-radius:16px;box-shadow:var(--sh-pop);overflow:hidden;z-index:12;animation:flyIn .18s var(--ease)}
@keyframes flyIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.menu .mh{background:var(--grad);color:#fff;padding:14px 16px}.menu .mh b{display:block;font-size:16px;line-height:1.2}.menu .mh small{font-size:13px;opacity:.8}
.menu .mb{padding:6px;display:grid;gap:1px}
.menu .mb button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:11px 12px;color:var(--muted);font-size:16px}
.menu .mb button:hover{background:var(--soft);color:var(--brand)}
.menu .mb button.dan{color:var(--bad)}.menu .mb button.dan:hover{background:var(--bad-soft)}
.menu svg{flex:none}

main{max-width:640px;margin:0 auto;padding:18px 16px 48px;display:flex;flex-direction:column;gap:16px}
h1{font-size:30px;line-height:1.1;margin:0;color:var(--navy);letter-spacing:-.02em;font-weight:700;text-wrap:balance}
h2{font-size:17px;line-height:1.25;margin:0;color:var(--navy);font-weight:600;letter-spacing:.005em}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:1px solid light-dark(transparent,#1d2c46)}
.lbl{display:block;font-weight:400;font-size:15px;color:var(--muted);margin:0 0 6px 4px}
.in{width:100%;min-height:50px;border:1px solid var(--line2);border-radius:999px;padding:10px 18px;background:var(--input);font-size:17px;outline:none;transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease)}
.in::placeholder{color:var(--ph);font-style:italic}
.in:hover{border-color:light-dark(#c6d6ec,#2a3d5c)}
.in:focus{border-color:var(--brand);background:var(--input-f);box-shadow:0 0 0 3px light-dark(#d8e8fb,#173558)}
textarea.in{min-height:96px;resize:vertical;border-radius:18px;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:0;background:light-dark(#e3eaf3,#1d2c46);color:var(--muted);font-weight:600;text-decoration:none;white-space:nowrap;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s}
.btn:hover:not([disabled]){background:light-dark(#d6dde6,#243556);color:var(--ink)}
.btn.pri{background:var(--grad-btn);color:#fff;box-shadow:var(--sh-btn)}
.btn.pri:hover:not([disabled]){background:var(--grad-btn);color:#fff;transform:translateY(-1px);box-shadow:0 12px 22px -8px rgba(14,87,181,.6)}
.btn.full{width:100%}.btn.sm{min-height:38px;padding:0 16px;font-size:15px}
.btn.bad{background:var(--bad-soft);color:var(--bad)}.btn[disabled]{opacity:.55;cursor:default}
.lnk{background:none;border:0;padding:6px 0;color:var(--brand);font-weight:600;font-size:15px}
a.lnk{text-decoration:none;padding:0}.lnk:hover{text-decoration:underline}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nota{font-size:15px;color:var(--muted)}
.err{color:var(--bad);margin:0}.err:empty{display:none}
.proto{font-size:13px;color:var(--subtle);text-align:center;margin:0}
.demo{background:var(--warn-soft);color:var(--warn);text-align:center;font-size:14px;padding:6px 12px}

/* ── Acceso (estilo login de EDEM) ── */
:root[data-vista=login] .top{display:none}
:root[data-vista=login] main{max-width:none;padding:0;gap:0}
.acceso{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr)}
.bpane{position:relative;overflow:hidden;color:#fff;background:var(--grad-brand);padding:calc(28px + env(safe-area-inset-top)) 24px 84px;display:flex;flex-direction:column;gap:22px}
:root[data-theme=dark] .bpane{background:radial-gradient(ellipse 70% 55% at 22% 92%,rgba(95,200,212,.30) 0%,rgba(42,157,171,.10) 35%,transparent 65%),radial-gradient(ellipse 90% 80% at 50% 40%,#0e2d5e 0%,#08214a 35%,#051838 70%,#03102a 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .bpane{background:radial-gradient(ellipse 70% 55% at 22% 92%,rgba(95,200,212,.30) 0%,rgba(42,157,171,.10) 35%,transparent 65%),radial-gradient(ellipse 90% 80% at 50% 40%,#0e2d5e 0%,#08214a 35%,#051838 70%,#03102a 100%)}}
.bpane .dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.14) 1.2px,transparent 1.6px);background-size:18px 18px;-webkit-mask-image:radial-gradient(ellipse 45% 70% at 75% 35%,#000 0%,transparent 75%);mask-image:radial-gradient(ellipse 45% 70% at 75% 35%,#000 0%,transparent 75%);opacity:.7;pointer-events:none}
.bpane .mapa{position:absolute;inset:0;background:url(mapa-europa.webp) no-repeat right -35% top 45%/70%;opacity:.28;pointer-events:none;animation:flota 6s ease-in-out infinite;-webkit-mask-image:linear-gradient(to right,#000 70%,transparent);mask-image:linear-gradient(to right,#000 70%,transparent)}
@keyframes flota{0%,100%{transform:none}50%{transform:translateY(-5px)}}
.bpane>*{position:relative}
.bpane .blogo{width:72px;height:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.bpane h2{color:#fff;font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.05;letter-spacing:-.01em;margin:0}
.bpane h2 span{display:block;font-weight:300;font-style:italic;color:rgba(255,255,255,.8);font-size:.62em;margin-top:6px}
.bpane .bpie{font-size:13px;color:rgba(255,255,255,.72);margin:0;letter-spacing:.02em}
.bpane .bpie b{display:block;color:#fff;font-weight:600;font-size:14px}
.fstage{display:flex;flex-direction:column;align-items:center;padding:0 16px 32px;margin-top:-56px;position:relative;z-index:1}
.lcard{width:100%;max-width:440px;background:var(--card);border-radius:26px;padding:28px 24px 24px;box-shadow:var(--sh);display:grid;gap:18px;animation:cardIn .5s var(--ease) both;border:1px solid light-dark(transparent,#1d2c46)}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.lcard .greet{font-size:clamp(28px,7vw,32px);line-height:1.12;color:var(--brand);font-weight:700;letter-spacing:-.02em;margin:0}
.campo{position:relative}.campo .in{padding-left:52px}
.campo .ico{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--grad-btn);color:#fff;pointer-events:none}
.campo .ojo{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--subtle);display:grid;place-items:center}
.campo .ojo:hover{color:var(--brand)}
.campo.pw .in{padding-right:52px}
.lpie{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;max-width:440px;margin-top:16px;padding:0 6px}
.tswitch{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--muted);font-size:14px;padding:6px 0}
.tswitch i{width:46px;height:26px;border-radius:999px;background:light-dark(#cdd9ea,#243556);position:relative;transition:background .2s}
.tswitch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
:root[data-theme=dark] .tswitch i{background:var(--grad-btn)}:root[data-theme=dark] .tswitch i::after{transform:translateX(20px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tswitch i{background:var(--grad-btn)}:root:not([data-theme=light]) .tswitch i::after{transform:translateX(20px)}}
@media(min-width:900px){
 .acceso{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);padding:10px;gap:10px;background:light-dark(#cdd7e8,#070f1c)}
 .bpane{border-radius:22px;padding:44px 56px 48px;justify-content:space-between;min-height:calc(100dvh - 20px)}
 .bpane .blogo{width:88px}.bpane h2{font-size:clamp(44px,4.6vw,64px)}.bpane .mapa{background-position:right -40% top 50%;background-size:85%}
 .fstage{margin-top:0;justify-content:center;background:var(--bg);border-radius:22px;padding:32px}
 .lcard{padding:40px 40px 32px}
}

/* ── Inicio ── */
.hola .gsm{margin:0;font-size:21px;font-weight:300;color:light-dark(#5f7fa6,#7a96b8);line-height:1.2}
.hola h1{font-size:32px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chip{font-size:13px;font-weight:600;color:var(--muted);background:var(--card);border-radius:999px;padding:4px 12px;box-shadow:var(--sh-sm);border:1px solid light-dark(transparent,#1d2c46)}
.aviso{border-radius:var(--r);padding:16px 18px;background:var(--card);box-shadow:var(--sh);position:relative;overflow:hidden;border:1px solid light-dark(transparent,#1d2c46)}
.aviso::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--grad-btn)}
.aviso.inc::before,.aviso.Urgente::before{background:var(--bad)}.aviso.Importante::before{background:var(--m-biz)}
.aviso .et{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);margin:0 0 4px}
.aviso.inc .et,.aviso.Urgente .et{color:var(--bad)}.aviso.Importante .et{color:var(--warn)}
.aviso h3{margin:0 0 6px;font-size:18px;line-height:1.25;color:var(--navy)}.aviso p{margin:0 0 12px}
.cta{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:24px;padding:22px 20px;background:var(--grad-brand);color:#fff;box-shadow:0 18px 36px -18px rgba(10,58,130,.7);transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.cta::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.16) 1.2px,transparent 1.6px);background-size:16px 16px;-webkit-mask-image:radial-gradient(ellipse 50% 90% at 85% 20%,#000,transparent 75%);mask-image:radial-gradient(ellipse 50% 90% at 85% 20%,#000,transparent 75%)}
.cta:hover{transform:translateY(-1px);box-shadow:0 22px 40px -18px rgba(10,58,130,.8)}
.cta>*{position:relative}
.cta .ico{flex:none;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);display:grid;place-items:center}
.cta b{display:block;font-size:21px;line-height:1.15;font-weight:700}.cta span{font-size:15px;opacity:.85;font-weight:300}.cta .fl{margin-left:auto;font-size:28px;opacity:.85;font-weight:300}
.mes{display:grid;gap:14px}
.mes .cab,.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.shead{margin-bottom:4px}
.cifra{font-size:clamp(34px,9.5vw,42px);font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--navy)}
.delta{font-size:14px;font-weight:600;color:var(--muted);margin-top:4px}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tres div{background:var(--card2);border-radius:14px;padding:10px 12px}.tres b{display:block;font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--navy)}.tres span{font-size:13px;color:var(--muted)}
.mini{display:flex;align-items:flex-end;gap:6px;height:58px}
.mini div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.mini i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:light-dark(#d8e8fb,#1d3252)}.mini i.on{background:linear-gradient(to top,#0e57b5,#4ea4ee)}
.mini small{font-size:11px;color:var(--muted);line-height:1}

/* ── Envíos ── */
.envio{display:flex;gap:12px;align-items:center;padding:12px 6px;margin:0 -6px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:calc(100% + 12px);background:none;text-align:left;border-radius:12px;transition:background .14s}
.envio:hover{background:var(--card2)}
.envio:last-child{border-bottom:0}
.envio .mi{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.mi.ef{background:var(--m-ef)}.mi.tpv{background:var(--m-tpv)}.mi.biz{background:var(--m-biz);color:#1d1600}
.envio .tx{flex:1}.envio .tx b{display:block;font-size:16px;line-height:1.25;color:var(--navy)}.envio small{color:var(--muted);font-size:13px}
.envio .im{text-align:right;flex:none}.envio .im b{display:block;font-variant-numeric:tabular-nums;font-size:16px;color:var(--navy)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap;line-height:1.5}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-in{background:var(--bad-soft);color:var(--bad)}.p-re{background:var(--soft);color:var(--brand-ink)}.p-fp{background:var(--warn-soft);color:var(--warn)}
.volver{display:flex;align-items:center;gap:12px}
.volver button{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);font-size:20px;line-height:1;color:var(--brand);display:grid;place-items:center}
.seg{display:flex;gap:6px;padding:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-height:38px;padding:0 16px;border:0;border-radius:999px;background:var(--card);box-shadow:var(--sh-sm);font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.seg button[aria-pressed=true]{background:var(--grad-btn);color:#fff;box-shadow:var(--sh-btn)}
.brow{display:flex;gap:8px}.brow .buscar{flex:1}
.fbtn{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:50px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--input);font-weight:600;color:var(--muted)}
.fbtn[aria-expanded=true]{border-color:var(--brand);color:var(--brand)}.fbtn i{font-style:normal;font-size:12px;background:var(--grad-btn);color:#fff;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.fpanel{display:grid;gap:6px;padding:14px 18px}.fpanel .sec{margin:4px 0 2px}
.activos{display:flex;gap:6px;flex-wrap:wrap}.activos button{min-height:32px;padding:0 12px;border-radius:999px;border:0;background:var(--soft);color:var(--brand-ink);font-weight:600;font-size:14px}
.buscar{position:relative}.buscar .in{padding-left:46px}
.buscar svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--subtle)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line2);font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed=true]{background:var(--grad-btn);box-shadow:var(--sh-btn);color:#fff}
.fchip i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px #fff}
.sep{flex-basis:100%;height:0}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kp div{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--sh);border:1px solid light-dark(transparent,#1d2c46)}
.kp b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--navy)}.kp span{font-size:13px;color:var(--muted)}
.kp .big1{grid-column:1/-1;background:var(--grad);color:#fff;border:0}.kp .big1 b{font-size:clamp(32px,8.5vw,38px);color:#fff}.kp .big1 span,.kp .big1 .sub{color:rgba(255,255,255,.82)}
@media(min-width:560px){.kp{grid-template-columns:repeat(4,1fr)}}
.kp .sub{display:block;margin-top:2px;font-size:14px;color:var(--ink)}
.graf{position:relative;margin-top:10px}.graf svg{display:block;width:100%;overflow:visible}
.ley{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;margin-top:10px}.ley span{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}.ley i{width:10px;height:10px;border-radius:50%;display:inline-block}.ley em{font-style:normal;color:var(--muted)}
.tip{position:absolute;z-index:3;pointer-events:none;background:light-dark(#06224a,#e8eef7);color:light-dark(#fff,#0e1a2c);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.35;min-width:140px;box-shadow:var(--sh-pop);transform:translate(-50%,-100%);font-variant-numeric:tabular-nums}
.tip b{display:block;font-size:14px}.tip span{display:flex;justify-content:space-between;gap:12px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:7px 0}
.hb .t{grid-column:1/-1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.hb .t i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#4ea4ee,#0e57b5)}
.hb span{font-size:15px}.hb b{font-size:15px;font-variant-numeric:tabular-nums;text-align:right;color:var(--navy)}.hb em{font-style:normal;color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
.mesg{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--sky);letter-spacing:.06em;text-transform:uppercase;padding:14px 0 6px;border-bottom:1px solid var(--line2)}
.vacio{text-align:center;padding:24px 8px;color:var(--muted)}
.velo{position:fixed;inset:0;background:rgba(6,34,74,.38);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.hoja{background:var(--card);width:100%;max-width:600px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--sh-pop);animation:sube .28s var(--ease)}
@keyframes sube{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.hoja .asa{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
@media(min-width:640px){.velo{align-items:center}.hoja{border-radius:26px;max-height:86vh}}

/* ── Declaración ── */
.metodos{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px 18px;border:1.5px solid transparent;border-radius:20px;background:var(--card);box-shadow:var(--sh);transition:border-color .15s,background .15s,transform .15s var(--ease)}
.opt:hover{transform:translateY(-1px)}
.opt[aria-pressed=true]{border-color:var(--brand);background:var(--card2);box-shadow:0 0 0 3px light-dark(#d8e8fb,#173558)}
.opt svg{flex:none}.opt b{display:block;font-size:18px;line-height:1.25;color:var(--navy)}.opt span{color:var(--muted);font-size:15px}
.paso{display:grid;gap:8px}.paso small{font-size:13px;font-weight:600;color:var(--sky);letter-spacing:.02em}
.pasos{display:flex;gap:6px}.pasos i{flex:1;height:6px;border-radius:3px;background:light-dark(#d8e8fb,#1d3252)}.pasos i.on{background:var(--grad-btn)}
.conc{background:linear-gradient(155deg,#0a3a82 0%,#06224a 100%);color:#fff;border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;box-shadow:0 14px 30px -18px rgba(6,34,74,.8)}
.conc code{font:700 clamp(20px,6vw,26px)/1.15 var(--font);letter-spacing:.3px;overflow-wrap:anywhere}
.conc .btn{background:#fff;color:#0a3a82;min-height:40px}
.regla{font-size:15px;border-left:4px solid var(--m-biz);background:var(--warn-soft);padding:10px 14px;border-radius:0 14px 14px 0;margin:0}
.sec{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);margin:16px 0 4px}
.linea{display:grid;grid-template-columns:1fr 132px;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.linea:last-of-type{border-bottom:0}
.linea label{font-size:16px}.linea .in{min-height:44px;text-align:right;font-variant-numeric:tabular-nums;padding:8px 16px}
.otro{display:grid;grid-template-columns:1fr 116px 44px;gap:8px;padding:6px 0}
.otro .in{min-height:44px;padding:8px 14px}
.x{min-height:44px;border:0;border-radius:50%;background:var(--bad-soft);color:var(--bad)}
.recibo{background:var(--paper);border-radius:14px;padding:20px 18px;position:relative;box-shadow:var(--sh);font-variant-numeric:tabular-nums}
.recibo::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:radial-gradient(circle at 6px 0,transparent 6px,var(--paper) 6.5px) 0 0/12px 8px}
.recibo h3{margin:0;font-size:15px;color:var(--muted);font-weight:600}
.big{font-size:clamp(36px,10vw,46px);font-weight:700;line-height:1.05;color:var(--navy);letter-spacing:-.02em}
.rl{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:16px}.rl span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.tot{border-top:2px solid var(--navy);margin-top:8px;padding-top:8px;font-weight:700;color:var(--navy)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:16px}
.chk b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px}
.chk.ok b{background:var(--ok)}.chk.no b{background:var(--bad)}.chk.av b{background:#c69100}
.foto{border:2px dashed light-dark(#b9cde8,#2a3d5c);border-radius:var(--r);padding:26px 18px;text-align:center;cursor:pointer;display:block;background:var(--card2);transition:border-color .15s,background .15s}
.foto:hover{border-color:var(--brand);background:var(--card)}
.foto b{font-size:18px;color:var(--navy)}
.arch{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.arch:last-child{border:0}.arch img{width:56px;height:56px;object-fit:cover;border-radius:12px}.arch span{flex:1;font-size:15px}
.lect{display:grid;gap:6px;font-size:15px}.lect b{color:var(--brand-ink)}
.bar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 28%);padding:18px 0 calc(8px + env(safe-area-inset-bottom));display:flex;gap:10px;margin-top:4px}
.bar .btn{flex:1;min-height:52px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:light-dark(#06224a,#e8eef7);color:light-dark(#fff,#0e1a2c);padding:11px 20px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center;box-shadow:var(--sh-pop)}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@media(max-width:420px){.grid2{grid-template-columns:1fr}.linea{grid-template-columns:1fr 116px}.otro{grid-template-columns:1fr 100px 44px}h1{font-size:27px}.hola h1{font-size:29px}.tres b{font-size:19px}.card{padding:16px}.marca small{font-size:11.5px}.uchip .ut small{display:none}}
@media(max-width:360px){.marca .vr,.marca small{display:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="marca"><img src="logo-ipue.png" alt="IPUE"><span class="vr" aria-hidden="true"></span><span><b>Tesorería</b><small>Formulario Digital Envíos</small></span></div>
  <button class="uchip" id="uchip" hidden aria-haspopup="true" aria-expanded="false"><span class="av" id="uav"></span><span class="ut"><b id="ucod"></b><small>Mi cuenta</small></span></button>
</div></header>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
