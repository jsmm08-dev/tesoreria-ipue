<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tesorería IPUE · Declarar ingreso</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00338D">
<link rel="icon" href="logo-ipue.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: institucional y sereno; una herramienta que un pastor usa de pie junto al cajero.
   IDEA: el resguardo bancario: cada paso va llenando un recibo que al final es el justificante del envío.
   PICTURE: la tarjeta-recibo viva con el total del desglose frente al importe del justificante.
   COLOUR: azul IPUE #00338D dominante, celeste #009FDA de apoyo, verde/rojo solo para cuadra/no cuadra.
   TYPE: Source Sans 3 (hermana libre de Myriad Pro, la letra IPUE). LAYOUT: una columna de 560px, pasos numerados, botón principal abajo. */
:root{color-scheme:light dark;
--bg:light-dark(#EEF2F8,#0B1220);--card:light-dark(#FFFFFF,#141D2E);--ink:light-dark(#14213D,#E8EDF6);--muted:light-dark(#55627A,#A3AFC4);
--line:light-dark(#D6DDE8,#2A3650);--brand:light-dark(#00338D,#5B8BEA);--brand-ink:light-dark(#00338D,#AFC8FF);--sky:light-dark(#009FDA,#3BBDEB);
--soft:light-dark(#E6EDF8,#1B2740);--ok:light-dark(#1F7A4A,#5CC98E);--ok-soft:light-dark(#E5F4EC,#14301F);--bad:light-dark(#B3261E,#F2867C);--bad-soft:light-dark(#FBE9E7,#3A1917);
--warn:light-dark(#8A5A00,#F0C060);--warn-soft:light-dark(#FFF4D6,#33280C);--paper:light-dark(#FFFEF8,#18202F)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3","Myriad Pro","Segoe UI",system-ui,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.top{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left))}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{height:46px;padding:4px 8px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none}
.logo img{height:38px;width:auto;display:block}
.top b{display:block;font-size:19px;line-height:1.1}.top small{opacity:.85;font-size:14px}
.salir{margin-left:auto;background:none;border:1px solid #ffffff80;color:#fff;border-radius:999px;min-height:40px;padding:0 14px;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
.proto{font-size:13px;color:var(--muted);text-align:center;margin:0}
h1{font-size:30px;line-height:1.08;margin:6px 0 2px;color:var(--brand-ink);text-wrap:balance}
h2{font-size:20px;margin:0;color:var(--brand-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.lbl{display:block;font-weight:600;margin:0 0 6px}
.in{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);font-size:17px}
textarea.in{min-height:84px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.full{width:100%}
.btn.bad{border-color:var(--bad);color:var(--bad)}.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aviso{border-radius:14px;padding:14px;border:1px solid var(--line);background:var(--card)}
.aviso.inc{border-color:var(--bad);background:var(--bad-soft)}.aviso.msg{border-color:var(--sky);background:var(--soft)}
.aviso h3{margin:0 0 4px;font-size:17px}.aviso p{margin:0 0 10px}
.metodos{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}
.opt[aria-pressed=true]{border-color:var(--brand);background:var(--soft)}
.opt svg{flex:none}.opt b{display:block;font-size:18px}.opt span{color:var(--muted);font-size:15px}
.pasos{display:flex;gap:6px}.pasos i{flex:1;height:6px;border-radius:3px;background:var(--line)}.pasos i.on{background:var(--sky)}
.conc{background:var(--brand);color:#fff;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.conc code{font:700 26px/1.1 "Source Sans 3",system-ui,sans-serif;letter-spacing:.5px}
.conc .btn{background:#fff;color:#00338D;border:0;min-height:44px}
.regla{font-size:15px;border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 10px 10px 0}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 4px}
.linea{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.linea label{font-size:16px}.linea .in{min-height:44px;text-align:right;font-variant-numeric:tabular-nums}
.otro{display:grid;grid-template-columns:1fr 130px 44px;gap:8px;padding:6px 0}
.x{min-height:44px;border:1px solid var(--line);border-radius:10px;background:none;cursor:pointer}
.recibo{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px 16px;position:relative;box-shadow:0 10px 24px -18px #00338D;font-variant-numeric:tabular-nums}
.recibo::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:radial-gradient(circle at 6px 0,transparent 6px,var(--paper) 6.5px) 0 0/12px 8px}
.recibo h3{margin:0;font-size:15px;color:var(--muted);font-weight:600}
.big{font-size:clamp(34px,10vw,46px);font-weight:700;line-height:1;color:var(--brand-ink)}
.rl{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:16px}.rl span:last-child{white-space:nowrap}
.tot{border-top:2px solid var(--ink);margin-top:8px;padding-top:8px;font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:16px}
.chk b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px}
.chk.ok b{background:var(--ok)}.chk.no b{background:var(--bad)}.chk.av b{background:var(--warn)}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-in{background:var(--bad-soft);color:var(--bad)}.p-re{background:var(--soft);color:var(--brand-ink)}.p-fp{background:var(--warn-soft);color:var(--warn)}
.envio{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.envio:last-child{border:0}.envio small{color:var(--muted);display:block}
.foto{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;display:block}
.foto img{max-height:220px;border-radius:8px;margin-top:8px}
.nota{font-size:14px;color:var(--muted)}
.arch{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}.arch img{width:56px;height:56px;object-fit:cover;border-radius:8px}.arch span{flex:1;font-size:15px}
.demo{background:var(--warn-soft);color:var(--warn);text-align:center;font-size:14px;padding:6px}
.err{color:var(--bad);margin:0}
.lect{display:grid;gap:6px;font-size:15px}.lect b{color:var(--brand-ink)}
.bar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:16px 0 calc(8px + env(safe-area-inset-bottom));display:flex;gap:10px}
.bar .btn{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:400px){.linea{grid-template-columns:1fr 112px}.otro{grid-template-columns:1fr 100px 44px}h1{font-size:26px}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="logo"><img src="logo-ipue.png" alt="IPUE"></div><div><b>Tesorería IPUE</b><small id="sub">tesoreria.ipue.app</small></div><button class="salir" id="salir" hidden>Salir</button></div></header>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
